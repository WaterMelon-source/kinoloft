<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kinoloft</title>
    <link rel="icon" type="image/png" href="kino_icon.png" />
    <link rel="stylesheet" href="styles.css" />
    <!-- PWA / iOS Web App настройки -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Kinoloft" />
    <meta name="theme-color" content="#090808" />
    <link rel="apple-touch-icon" href="kino_icon.png" />

    <!-- Для корректного масштабирования на iOS -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
  </head>
  <body>
    <header>
      <div class="header-top">
        <div class="brand">
          <img src="kino_icon.png" alt="Kinoloft" class="brand-icon" />
          <h1>Kinoloft</h1>
        </div>
        <div class="search-box">
          <input
            type="text"
            id="search-input"
            placeholder="Поиск фильмов и сериалов..."
            autocomplete="off"
          />
          <button id="search-btn" aria-label="Найти">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#ffffff"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="7" />
              <line x1="16.5" y1="16.5" x2="21" y2="21" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main>
      <section id="empty-state" class="empty-state">
        <div class="empty-icon">🍿</div>
        <h2>Найди свой фильм</h2>
        <p>Введи название в строку поиска выше — и мы найдём его для тебя.</p>
      </section>

      <section id="results-section" class="hidden">
        <div class="section-header">
          <h2>Результаты поиска</h2>
          <button id="clear-search" class="clear-btn">✕ Сбросить</button>
        </div>
        <div id="results-grid" class="movie-grid"></div>
        <div id="no-results" class="no-results hidden">
          <p>😔 Ничего не найдено. Попробуй другой запрос.</p>
        </div>
      </section>
    </main>

    <footer>
      <p>© Kinoloft · Смотрите бесплатно и с удовольствием</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
